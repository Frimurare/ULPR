{% extends 'base.html' %}
{% block title %}Byt lösenord{% endblock %}
{% block content %}
<h1>Byt administratörslösenord</h1>
{% if forced %}<div class="flash warn">Standardlösenordet används fortfarande. Välj ett eget lösenord innan du fortsätter.</div>{% endif %}
<form method="post" class="card narrow">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Nuvarande lösenord<input type="password" name="current" autocomplete="current-password" required></label>
  <label>Nytt lösenord (minst 8 tecken)<input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
  <label>Upprepa nytt lösenord<input type="password" name="repeat" autocomplete="new-password" minlength="8" required></label>
  <div class="actions"><button class="btn primary" type="submit">Spara lösenord</button></div>
</form>
{% endblock %}
